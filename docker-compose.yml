services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: waiverwire
      POSTGRES_PASSWORD: ${WW_DB_PASSWORD:-waiverwire}
      POSTGRES_DB: waiverwire
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waiverwire"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "${WW_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      WW_DATABASE_URL: postgresql+psycopg2://waiverwire:${WW_DB_PASSWORD:-waiverwire}@db:5432/waiverwire
      WW_DATA_PATH: /srv/app/dashboard/data.json
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "cd /srv/app/backend && alembic -c alembic.ini upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
